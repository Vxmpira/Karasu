<!--{"file":"contact.html","path":"/contact","title":"Contact Karasu","desc":"Ask a question about Karasu, your account or the data."}-->
<div class="split">
  <div class="side"><p class="kick">Contact</p><h1 style="margin-top:14px">Ask us anything.</h1><p class="lede">A question about the data, a problem with your account, or a source you think belongs on the map. A person reads every message.</p>
    <dl class="kv" style="margin-top:30px"><dt>Email</dt><dd><a href="mailto:BlackCrownVxJ.LLC@outlook.com">BlackCrownVxJ.LLC@outlook.com</a></dd><dt>Company</dt><dd>BlackCrownVxJ.LLC</dd><dt>Replies</dt><dd>Usually within two business days</dd></dl></div>
  <div class="main">
    <form data-form="contact" novalidate>
      <label>Name<input type="text" name="name" id="contact-name" autocomplete="name" maxlength="80"></label>
      <label>Email<input type="email" name="email" id="contact-email" autocomplete="email" required></label>
      <label>What is it about<select name="topic" id="contact-topic"><option>A question about the data</option><option>My account</option><option>Billing</option><option>A source to add</option><option>Press or partnership</option><option>Something else</option></select></label>
      <label>Message<textarea name="message" id="contact-message" required maxlength="4000"></textarea></label>
      <p class="msg" role="alert"></p>
      <button class="btn pri" type="submit">Send message</button>
    </form>
  </div>
</div>
