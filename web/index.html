<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karasu Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: a one-screen terminal. Header, then a pulse strip, then rail | map | data point card. Tickers, Desks and Sources swap into the same frame. */
  --ink:#08070B; --panel:#0E0C13; --panel2:#15121A; --panel3:#1C1823;
  --line:rgba(228,226,236,.09); --line2:rgba(228,226,236,.17);
  --bone:#E4E2EC; --mute:#A3A0B4; --dim:#6F6B80;
  --pink:#FF2D95; --pinksoft:#FF6FB6; --cyan:#49D7FF; --green:#35E08F; --gold:#E8C77F; --down:#FF7A90;
  --display:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--bone);font:14px/1.5 var(--display);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4,p,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
.mono{font-family:var(--mono)}
.kick{font:500 10.5px/1.2 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--mute)}
.num{font-variant-numeric:tabular-nums}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}

/* header */
.top{display:flex;align-items:center;gap:18px;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand svg{filter:drop-shadow(0 0 5px rgba(255,45,149,.45))}
.brand b{display:block;font:700 19px/1 var(--display);letter-spacing:.01em}
.brand i{display:block;margin-top:4px;font:500 9px/1 var(--mono);letter-spacing:.2em;color:var(--pink);font-style:normal}
.tabs{display:flex;gap:2px;flex:none}
.tabs a{padding:8px 14px;border-radius:7px;text-decoration:none;font-weight:500;color:var(--mute);border:1px solid transparent}
.tabs a:hover{color:var(--bone);background:var(--panel2)}
.tabs a[aria-current="page"]{color:var(--bone);background:var(--panel2);border-color:var(--line2);box-shadow:inset 0 -2px 0 var(--pink)}
.search{position:relative;flex:1;min-width:140px;max-width:420px;margin-left:auto}
.search input{width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--ink);font-size:13px}
.search input::placeholder{color:var(--dim)}
.qres{position:absolute;z-index:30;top:calc(100% + 6px);left:0;right:0;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:5px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.qres button{display:flex;gap:10px;align-items:baseline;width:100%;padding:7px 9px;border-radius:6px}
.qres button:hover,.qres button.on{background:var(--panel3)}
.qres .k{font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);flex:none;width:58px}
.qres .none{padding:8px 10px;color:var(--mute);font-size:13px}
.samplechip{flex:none;font:500 10.5px var(--mono);letter-spacing:.06em;color:var(--gold);border:1px dashed rgba(232,199,127,.5);border-radius:99px;padding:5px 10px;white-space:nowrap}
.plan{display:flex;flex:none;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.plan button{padding:7px 12px;font:500 12px var(--mono);color:var(--mute)}
.plan button[aria-pressed="true"]{background:var(--pink);color:#12060C;font-weight:700}

/* views */
main{min-height:0;position:relative}
.view{height:100%;min-height:0}
.view[hidden]{display:none!important}
.status{display:flex;gap:16px;align-items:center;padding:5px 16px;border-top:1px solid var(--line);background:var(--panel);font:400 11px var(--mono);color:var(--dim)}
.status .sp{margin-left:auto}
.status b{color:var(--mute);font-weight:500}

/* map view */
#v-map{display:grid;grid-template-rows:auto minmax(0,1fr)}
.pulse{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-bottom:1px solid var(--line)}
.pulse button{padding:9px 14px 10px;border-right:1px solid var(--line);border-left:3px solid var(--c,var(--dim));min-width:0}
.pulse button:last-child{border-right:0}
.pulse button:hover{background:var(--panel)}
.pulse .v{display:flex;align-items:baseline;gap:8px;margin-top:3px;white-space:nowrap}
.pulse .v b{font:600 18px/1.1 var(--display)}
.pulse .v span{font:400 11px var(--mono);color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.mapgrid{display:grid;grid-template-columns:232px minmax(0,1fr) 392px;min-height:0}
.rail{border-right:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0;display:flex;flex-direction:column}
.rail section{padding:13px 14px;border-bottom:1px solid var(--line)}
.rail h3{margin-bottom:9px}
.lyr-row{display:flex;align-items:center;gap:9px;width:100%;padding:6px 6px;border-radius:7px}
.lyr-row:hover{background:var(--panel2)}
.lyr-row .nm{font-weight:500}
.lyr-row .ct{margin-left:auto;font:400 10.5px var(--mono);color:var(--dim);text-align:right;line-height:1.25;white-space:nowrap}
.sw{flex:none;width:26px;height:15px;border-radius:99px;background:var(--panel3);border:1px solid var(--line2);position:relative}
.sw::after{content:"";position:absolute;top:1.5px;left:1.5px;width:10px;height:10px;border-radius:50%;background:var(--dim)}
[aria-pressed="true"]>.sw{background:color-mix(in srgb,var(--c,var(--bone)) 30%,transparent);border-color:var(--c,var(--bone))}
[aria-pressed="true"]>.sw::after{left:12.5px;background:var(--c,var(--bone))}
[aria-pressed="false"]>.nm{color:var(--dim)}
.center{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;min-width:0}
.blotter{border-top:1px solid var(--line);background:var(--panel);min-width:0}
.bl-h{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;padding:9px 14px 6px}
.bl-s{max-height:172px;overflow:auto}
.fd{cursor:pointer}
.fd:hover td{background:var(--panel2)}
.fd td{padding:6px 8px;border-bottom:1px solid var(--line);font-size:13px}
.fd td:first-child{padding-left:14px;white-space:nowrap;font:400 11.5px var(--mono);color:var(--mute);width:1%}
.fd .ly{white-space:nowrap;width:1%;color:var(--mute);font-size:12.5px}
.fd .ly .dot{display:inline-block;margin-right:7px}
.fd .tg{white-space:nowrap;text-align:right;padding-right:14px;font:500 11.5px var(--mono);color:var(--tone);width:1%}
.hv{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;width:100%;padding:6px 6px;border-radius:7px}
.hv:hover{background:var(--panel2)}
.hv b{display:block;font-weight:500;font-size:13px;line-height:1.3}
.hv small{display:block;font:400 10.5px var(--mono);color:var(--tone);margin-top:1px}
.hv svg{margin-top:1px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}

.mapwrap{position:relative;min-height:0;min-width:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#100D17 0%,var(--ink) 70%)}
#base,#shipc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#map{position:relative;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.region{fill:rgba(255,45,149,.07);stroke:var(--pink);stroke-width:1.6;vector-effect:non-scaling-stroke}
.shiptip{position:absolute;z-index:5;pointer-events:none;padding:4px 8px;border-radius:6px;background:var(--panel3);border:1px solid var(--line2);font:500 11px var(--mono);white-space:nowrap}
.shipstat{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);padding:5px 10px;border-radius:99px;border:1px solid var(--line2);background:rgba(14,12,19,.86);font:500 11px var(--mono);color:var(--mute);backdrop-filter:blur(6px);pointer-events:none}
.shipstat b{color:var(--c,var(--gold));font-weight:500}
.simnote{margin-top:12px;padding:9px 11px;border:1px dashed rgba(232,199,127,.5);border-radius:8px;color:var(--gold);font-size:12.5px;line-height:1.4}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:14px}
.minis div{background:var(--panel2);padding:10px 11px}
.minis b{display:block;font:600 19px/1.1 var(--display)}
.minis span{display:block;margin-top:3px;font-size:11.5px;line-height:1.3;color:var(--mute)}
.tie.co{grid-template-columns:62px minmax(0,1fr) auto}
.tie.co .why b{color:var(--bone);font-weight:500}
.capv{font:400 11.5px var(--mono);color:var(--mute);white-space:nowrap}
.facts{margin-top:16px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--panel);grid-template-columns:repeat(3,auto 1fr)}
.keyst{font:500 10.5px var(--mono);border-radius:99px;padding:2px 9px;border:1px solid currentColor;white-space:nowrap}
.keyst.none{color:var(--green)}.keyst.free{color:var(--gold)}.keyst.pick{color:var(--pinksoft)}.keyst.set{color:var(--ink);background:var(--green);border-color:var(--green)}
#map:active{cursor:grabbing}
.ocean{fill:transparent}
.grat{fill:none;stroke:rgba(228,226,236,.045);stroke-width:1;vector-effect:non-scaling-stroke}
.land{fill:#241F2F;stroke:none}
.bord{fill:none;stroke:rgba(228,226,236,.13);stroke-width:.7;vector-effect:non-scaling-stroke}
.coast{fill:none;stroke:rgba(228,226,236,.3);stroke-width:.9;vector-effect:non-scaling-stroke}
.stb{fill:none;stroke:rgba(228,226,236,.13);stroke-width:.7;vector-effect:non-scaling-stroke;stroke-dasharray:3 2}
.stf{fill:rgba(232,199,127,.13);stroke:rgba(232,199,127,.5);stroke-width:1;vector-effect:non-scaling-stroke}
.lane-g{fill:none;stroke:rgba(255,111,182,.10);stroke-width:7;vector-effect:non-scaling-stroke;stroke-linecap:round}
.lane{fill:none;stroke:rgba(255,111,182,.42);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:5 4}
.ships{fill:none;stroke:rgba(228,226,236,.62);stroke-width:var(--shipw,2px);vector-effect:non-scaling-stroke;stroke-linecap:round}
.anch{fill:none;stroke:var(--gold);stroke-width:var(--shipw,2px);vector-effect:non-scaling-stroke;stroke-linecap:round}
.geo text{font:500 10px var(--mono);letter-spacing:.14em;fill:rgba(163,160,180,.55);text-anchor:middle;pointer-events:none;text-transform:uppercase}
.geo text.st{letter-spacing:.06em;fill:rgba(163,160,180,.42);font-size:9.5px}
.corr path{fill:none;stroke:var(--c);stroke-width:1.4;stroke-dasharray:5 4;opacity:.85}
.corr circle{fill:none;stroke:var(--c);stroke-width:1.4}
.mk{cursor:pointer}
.mk .hit{fill:transparent}
.mk .sh{stroke:var(--ink);stroke-width:1.5}
.mk.hot .sh{fill:var(--c);filter:drop-shadow(0 0 4px var(--c))}
.mk.soon .sh{fill:var(--panel);stroke:var(--c);stroke-width:1.3;stroke-dasharray:2.4 2;opacity:.8}
.mk .core{fill:var(--ink)}
.mk .ring{fill:none;stroke:var(--bone);stroke-width:1.5}
.mk .pulse-r{fill:none;stroke:var(--c);stroke-width:1.5;opacity:.6;animation:ping 2.4s ease-out infinite}
.mk .plus rect{fill:var(--bone)} .mk .plus text{font:700 9px var(--mono);fill:var(--ink);text-anchor:middle}
.mk:hover .sh,.mk:focus-visible .sh{stroke:var(--bone)}
.mk:focus-visible{outline:none}
.mk.cl .bg{fill:var(--panel2);stroke:var(--ink);stroke-width:2}
.mk.cl text{font:700 11px var(--mono);fill:var(--bone);text-anchor:middle;pointer-events:none}
.mk.cl.dimc text{fill:var(--mute)}
.mk.cl:hover .bg,.mk.cl:focus-visible .bg{fill:var(--panel3)}
.mlab text{font:500 11px var(--mono);fill:var(--bone);paint-order:stroke;stroke:var(--ink);stroke-width:3.2px;stroke-linejoin:round;pointer-events:none}
.mlab text.soon{fill:var(--mute);font-weight:400}
.mlab text.dt{font-size:10px;fill:var(--tone);font-weight:400}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.4);opacity:0}}
.ov{position:absolute;display:flex;gap:6px;flex-wrap:wrap}
.ov.tl{top:10px;left:10px;right:64px}
.ov.tr{top:10px;right:10px;flex-direction:column}
.chipbtn{padding:5px 10px;border-radius:99px;border:1px solid var(--line2);background:rgba(14,12,19,.86);font:500 11.5px var(--mono);color:var(--mute);backdrop-filter:blur(6px)}
.chipbtn:hover{color:var(--bone);border-color:var(--mute)}
.chipbtn[aria-pressed="true"]{color:var(--ink);background:var(--bone);border-color:var(--bone)}
.zb{width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);background:rgba(14,12,19,.86);display:grid;place-items:center;font:500 18px/1 var(--mono);color:var(--bone);backdrop-filter:blur(6px)}
.zb:hover{border-color:var(--mute)}
.legend{display:grid;gap:7px;font:400 11px/1.35 var(--mono);color:var(--mute)}
.legend span{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:center}
.maperr{position:absolute;inset:auto 12px 60px 12px;padding:10px 12px;border:1px solid var(--down);border-radius:8px;background:var(--panel);color:var(--bone)}

/* card */
.cardp{border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0}
.card{padding:16px 18px 26px}
.card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.lyrchip{display:inline-flex;align-items:center;gap:6px;font:500 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--c)}
.when{font:400 11px var(--mono);color:var(--dim);margin-left:auto}
.card h2{font:600 21px/1.2 var(--display);text-wrap:balance}
.sec{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.sec>h3{margin-bottom:8px}
.sec p{color:var(--bone);max-width:62ch}
.src{margin-top:7px;font:400 11px var(--mono);color:var(--dim)}
.read{border:1px solid color-mix(in srgb,var(--tone) 38%,transparent);background:color-mix(in srgb,var(--tone) 7%,transparent);border-radius:10px;padding:12px 13px}
.read-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:8px}
.tonechip{font:700 11px var(--mono);letter-spacing:.04em;color:var(--ink);background:var(--tone);border-radius:5px;padding:3px 8px}
.meta{font:400 11px var(--mono);color:var(--mute);display:inline-flex;align-items:center;gap:6px}
.meta b{color:var(--bone);font-weight:500}
.wbar{display:inline-flex;gap:2px;align-items:flex-end;height:11px}
.wbar i{width:4px;background:rgba(228,226,236,.2);border-radius:1px}
.wbar i:nth-child(1){height:5px}.wbar i:nth-child(2){height:8px}.wbar i:nth-child(3){height:11px}
.wbar.w1 i:nth-child(-n+1),.wbar.w2 i:nth-child(-n+2),.wbar.w3 i:nth-child(-n+3){background:var(--bone)}
.size{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2)}
.size .bar{height:7px;border-radius:99px;background:var(--panel3);overflow:hidden;margin:6px 0 6px}
.size .bar i{display:block;height:100%;background:var(--tone,var(--green));border-radius:99px;min-width:3px}
.size p{font-size:13px;color:var(--mute)}
.checks{counter-reset:c}
.checks li{counter-increment:c;display:grid;grid-template-columns:22px 1fr;gap:8px;padding:6px 0}
.checks li+li{border-top:1px solid var(--line)}
.checks li::before{content:counter(c);font:700 10.5px/20px var(--mono);width:20px;height:20px;text-align:center;border-radius:5px;background:var(--panel3);color:var(--mute)}
.tie{display:grid;grid-template-columns:62px 62px 1fr;gap:8px;align-items:baseline;width:100%;padding:7px 6px;border-radius:7px}
.tie:hover{background:var(--panel2)}
.tie+.tie,.ties details{border-top:1px solid var(--line)}
.sym{font:700 12.5px var(--mono);color:var(--bone)}
.eff{font:500 10.5px var(--mono);letter-spacing:.04em;border-radius:4px;padding:1px 6px;justify-self:start;border:1px solid currentColor}
.e-p{color:var(--green)}.e-m{color:var(--down)}.e-d{color:var(--gold)}.e-z{color:var(--mute)}
.tie .why{font-size:12.5px;color:var(--mute);line-height:1.4}
details summary{cursor:pointer;padding:8px 6px;font:500 11.5px var(--mono);color:var(--pinksoft);list-style:none}
details summary::-webkit-details-marker{display:none}
.rowbtn{display:grid;grid-template-columns:18px 1fr;gap:9px;align-items:start;width:100%;padding:8px 6px;border-radius:7px}
.rowbtn:hover{background:var(--panel2)}
.rowbtn+.rowbtn{border-top:1px solid var(--line)}
.rowbtn b{display:block;font-weight:500}
.rowbtn small{display:block;color:var(--mute);font-size:12.5px;line-height:1.35}
.rowbtn svg{margin-top:3px}
.lock{margin-top:16px;border:1px dashed var(--line2);border-radius:10px;padding:14px;background:repeating-linear-gradient(135deg,transparent 0 9px,rgba(228,226,236,.022) 9px 18px)}
.lock ul{margin:8px 0 12px;color:var(--mute);font-size:13px}
.lock li{padding:3px 0 3px 18px;position:relative}
.lock li::before{content:"";position:absolute;left:2px;top:9px;width:8px;height:7px;border:1.5px solid var(--dim);border-radius:2px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:8px;border:1px solid var(--line2);font:500 12.5px var(--mono);color:var(--bone)}
.btn:hover{border-color:var(--mute)}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#12060C;font-weight:700}
.soonchip{font:500 10.5px var(--mono);color:var(--mute);border:1px dashed var(--line2);border-radius:99px;padding:2px 9px}

/* tickers */
#v-tickers{display:grid;grid-template-columns:minmax(380px,34%) minmax(0,1fr)}
.tk-list{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tk-tools{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.tk-tools .row{display:flex;gap:5px;flex-wrap:wrap}
.fchip{padding:4px 10px;border-radius:99px;border:1px solid var(--line2);font:500 11px var(--mono);color:var(--mute)}
.fchip[aria-pressed="true"]{background:var(--bone);border-color:var(--bone);color:var(--ink)}
.tk-tools input{padding:7px 10px;border-radius:7px;border:1px solid var(--line2);background:var(--ink);font-size:13px}
.tk-scroll{overflow:auto;min-height:0;flex:1}
table{border-collapse:collapse;width:100%}
th{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
.tk-row{cursor:pointer}
.tk-row:hover td{background:var(--panel2)}
.tk-row.on td{background:var(--panel3)}
.tk-row.on td:first-child{box-shadow:inset 3px 0 0 var(--pink)}
.tk-row .nm{color:var(--mute);font-size:12.5px}
.tk-row .nm b{display:block;color:var(--bone);font-weight:500;font-size:13px}
.mix{display:flex;height:7px;width:86px;border-radius:99px;overflow:hidden;background:var(--panel3);margin-left:auto}
.mix i{display:block;height:100%}
.tk-detail{overflow:auto;min-height:0;padding:22px 28px 40px}
.tk-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.tk-head .big{font:700 44px/1 var(--mono);letter-spacing:-.02em}
.tk-head h2{font:600 20px/1.2 var(--display)}
.tk-head .sub{color:var(--mute);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:18px}
.kpi{background:var(--panel);padding:13px 15px;display:flex;flex-direction:column}
.kpi .kick{min-height:2.4em;display:flex;align-items:flex-end}
.kpi b{display:block;font:600 22px/1.15 var(--display);margin:5px 0 4px}
.kpi p{font-size:12.5px;color:var(--mute);line-height:1.4}
.asof{margin-top:8px;font:400 11px var(--mono);color:var(--dim)}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;margin-top:22px}
.blk{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px 18px}
.blk>h3{margin-bottom:11px}
.blk p{max-width:68ch}
.note{color:var(--mute);font-size:13px;margin-top:9px}
.mixbar{display:flex;height:26px;border-radius:7px;overflow:hidden;margin:4px 0 10px}
.mixbar i{display:block;height:100%}
.mixleg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--mute)}
.mixleg b{color:var(--bone);font-weight:500}
.sw2{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.sumbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--panel3);margin:2px 0 10px}
.sumbar i{display:block;height:100%}
.part{padding:10px 0}
.part+.part{border-top:1px solid var(--line)}
.part h4{font:600 13.5px var(--display);margin-bottom:3px}
.dp{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 22px}
.dp+.dp{margin-top:10px}
.dp-h{grid-column:1/-1;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.dp-h b{font:600 15px var(--display)}
.dp-h .btn{margin-left:auto;padding:5px 10px;font-size:11.5px}
.dp .lbl{margin-bottom:5px}
.dp .effline{display:flex;gap:8px;align-items:baseline;margin-bottom:8px}
.dp p{font-size:13.5px}
.dp .lock{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 11px var(--mono);border:1px solid var(--line2);border-radius:99px;padding:3px 10px;color:var(--mute)}
button.chip:hover{color:var(--bone);border-color:var(--mute)}
h3.sect{margin:26px 0 11px}

/* desks */
#v-desks{display:grid;grid-template-rows:auto minmax(0,1fr)}
.dk-tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.dk-tab{padding:7px 14px;border-radius:8px;border:1px solid var(--line2);font-weight:500;color:var(--mute);display:inline-flex;gap:8px;align-items:center}
.dk-tab[aria-pressed="true"]{color:var(--bone);background:var(--panel2);box-shadow:inset 0 -2px 0 var(--c)}
.dk-tab.soon{border-style:dashed;font-weight:400;font-size:13px}
.dk-sep{font:400 10.5px var(--mono);color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin:0 4px 0 10px}
.dk-body{overflow:auto;min-height:0;padding:20px 28px 40px}
.dk-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;margin-top:22px;align-items:start}
.dk-col{display:grid;gap:22px;min-width:0}
.dk-col>*,.dk-grid>*,.grid2>*{min-width:0}
.drivers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.drivers div{background:var(--panel);padding:13px 15px}
.drivers h4{font:600 13.5px var(--display);margin-bottom:4px}
.drivers p{font-size:13px;color:var(--mute)}
.hb{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.hb .tr{height:12px;background:var(--panel3);border-radius:3px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--c);border-radius:3px}
.hb .vl{font:500 12.5px var(--mono);text-align:right}
.div{display:grid;grid-template-columns:118px minmax(0,1fr) 148px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.div .tr{position:relative;height:14px;background:linear-gradient(90deg,transparent calc(50% - .5px),var(--line2) calc(50% - .5px) calc(50% + .5px),transparent calc(50% + .5px))}
.div .tr i{position:absolute;top:1px;bottom:1px;border-radius:2px}
.div .vl{font:500 12px var(--mono);text-align:right;line-height:1.3}
.div .vl small{display:block;color:var(--dim);font-weight:400}
.chain{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0}
.node{position:relative;padding:12px 18px 12px 14px;border:1px solid var(--line);border-right:0;background:var(--panel2);min-width:0}
.node:first-child{border-radius:10px 0 0 10px}.node:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}
.node:not(:last-child)::after{content:"";position:absolute;right:-7px;top:50%;width:12px;height:12px;transform:translateY(-50%) rotate(45deg);background:var(--panel2);border-top:1px solid var(--line2);border-right:1px solid var(--line2);z-index:1}
.node h4{font:600 13px var(--display)}
.node p{font-size:12px;color:var(--mute);margin:2px 0 8px;line-height:1.35}
.node .chips{gap:4px}.node .chip{padding:2px 7px;font-size:10.5px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:13px}
.spec dt{color:var(--mute)}.spec dd{margin:0;font-family:var(--mono);font-size:12.5px}
.tbl td,.tbl th{padding:7px 8px}
.tbl th{position:static;background:none}
.tbl td.mn{font-family:var(--mono);font-size:12.5px}
.tbl button.lnk{color:var(--pinksoft);font:500 11.5px var(--mono)}
.tbl button.lnk:hover{text-decoration:underline}
.tbl .sm{color:var(--mute);font-size:12.5px}
.mini{height:6px;border-radius:99px;background:var(--panel3);overflow:hidden;width:70px;display:inline-block;vertical-align:middle;margin-right:7px}
.mini i{display:block;height:100%;background:var(--green)}
.scroller{overflow-x:auto}
svg.chart{display:block;width:100%;height:auto}
svg.chart text{font:400 10.5px var(--mono);fill:var(--mute)}
svg.chart text.b{fill:var(--bone);font-weight:500}

/* sources */
#v-sources{overflow:auto}
.src-wrap{padding:22px 28px 44px;max-width:1500px}
.src-wrap h2{font:600 24px/1.2 var(--display);text-wrap:balance;max-width:30ch}
.src-wrap .lede{color:var(--mute);margin-top:8px;max-width:66ch}
.st{font:500 10.5px var(--mono);border-radius:99px;padding:2px 9px;border:1px solid currentColor;white-space:nowrap}
.st.sample{color:var(--green)}.st.next{color:var(--gold)}.st.later{color:var(--mute);border-style:dashed}

@media (max-width:1180px){
  .mapgrid{grid-template-columns:204px minmax(0,1fr) 340px}
  .samplechip{display:none}
  .pulse{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pulse button:nth-child(-n+3){border-bottom:1px solid var(--line)}
  .grid2,.dk-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:920px){
  html,body{height:auto}
  #app{height:auto;display:block}
  .top{flex-wrap:wrap;gap:10px 12px}
  .search{order:5;flex:1 1 100%;max-width:none;margin:0}
  .plan{margin-left:auto}
  .view{height:auto}
  #v-map,#v-tickers,#v-desks{display:block}
  .mapgrid{display:flex;flex-direction:column}
  .center{order:1}.cardp{order:2}.rail{order:3}
  .mapwrap{height:62vh;min-height:380px}
  .rail{border-right:0;overflow:visible}
  .center{display:block}
  .bl-s{max-height:none}
  .fd .ly{display:none}
  .facts{grid-template-columns:auto 1fr}
  .cardp{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .tk-list{border-right:0}
  .tk-scroll{max-height:320px}
  .tk-detail,.dk-body,.src-wrap{padding:18px 16px 32px;overflow:visible}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dp{grid-template-columns:minmax(0,1fr)}
  .chain{grid-auto-flow:row}
  .node,.node:first-child,.node:last-child{border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
  .node:not(:last-child)::after{right:auto;left:22px;top:auto;bottom:-7px;transform:rotate(135deg)}
  .status{flex-wrap:wrap}
}
@media (max-width:640px){
  .tabs a{padding:7px 10px}
  .pulse{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pulse button{border-bottom:1px solid var(--line)}
  .pulse .v{flex-wrap:wrap;white-space:normal;gap:2px 8px}
  .drivers{grid-template-columns:minmax(0,1fr)}
  .tk-head .big{font-size:34px}
  .hb,.div{grid-template-columns:92px minmax(0,1fr) auto}
  .tie{grid-template-columns:54px 58px 1fr}
}
@media (prefers-reduced-motion:reduce){.mk .pulse-r{animation:none;opacity:0}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <a class="brand" href="#map" aria-label="Karasu by BlackCrown, go to the map">
      <svg aria-hidden="true" width="40" height="36" viewBox="0 0 36 32" fill="none" stroke="#FF2D95" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M35 10 L28 7 L24 4 L18.5 8.5 L2 24 L22 21.5 L26 14.5 L28 12.5 Z"></path><path d="M7 28.5 L28 28.5"></path></svg>
      <span><b>Karasu</b><i>BY BLACKCROWN</i></span>
    </a>
    <nav class="tabs" aria-label="Views">
      <a href="#map" data-view="map">Map</a>
      <a href="#tickers" data-view="tickers">Tickers</a>
      <a href="#desks" data-view="desks">Desks</a>
      <a href="#sources" data-view="sources">Sources</a>
    </nav>
    <div class="search">
      <input id="q" type="search" placeholder="Search a ticker, company or place" autocomplete="off" aria-label="Search tickers, companies and places">
      <div id="qres" class="qres" hidden></div>
    </div>
    <span class="samplechip">Prototype · sample data</span>
    <div class="plan" role="group" aria-label="Plan preview">
      <button id="plan-free" type="button" data-act="plan-free" aria-pressed="false">Free</button>
      <button id="plan-paid" type="button" data-act="plan-paid" aria-pressed="true">Paid</button>
    </div>
  </header>

  <main>
    <section id="v-map" class="view" aria-label="Map">
      <div class="pulse" id="pulse"></div>
      <div class="mapgrid">
        <aside class="rail" aria-label="Layers and live feed">
          <section>
            <h3 class="kick">Layers</h3>
            <div id="layers"></div>
          </section>
          <section>
            <h3 class="kick">Heaviest reads</h3>
            <div id="heavy"></div>
          </section>
          <section>
            <h3 class="kick">Map key</h3>
            <div class="legend" id="legend"></div>
          </section>
        </aside>
        <div class="center">
        <div class="mapwrap" id="mapwrap">
          <svg id="base" aria-hidden="true">
            <g id="g-map">
              <path class="grat" id="grat"></path>
              <path class="land" id="land-lo"></path><path class="land" id="land-hi" style="display:none"></path>
              <path class="bord" id="bord-lo"></path><path class="bord" id="bord-hi" style="display:none"></path>
              <path class="coast" id="coast-lo"></path><path class="coast" id="coast-hi" style="display:none"></path>
              <g id="st-fill"></g>
              <path class="stb" id="st-bord" style="display:none"></path>
              <path class="lane-g" id="lane-g"></path><path class="lane" id="lane"></path>
              <path class="region" id="region"></path>
            </g>
          </svg>
          <canvas id="shipc" aria-hidden="true"></canvas>
          <svg id="map" tabindex="0" role="application" aria-label="World map of data points, ships, states and countries. Drag to pan. Scroll or use the plus and minus keys to zoom. Select a ship, a state or a country for details.">
            <g class="geo" id="g-geo"></g>
            <g class="corr" id="g-corr"></g>
            <g id="g-mark"></g>
            <g class="mlab" id="g-lab"></g>
          </svg>
          <div class="ov tl" id="presets"></div>
          <div class="shiptip" id="shiptip" hidden></div>
          <div class="shipstat" id="shipstat"></div>
          <div class="ov tr">
            <button class="zb" type="button" data-act="zin" aria-label="Zoom in">+</button>
            <button class="zb" type="button" data-act="zout" aria-label="Zoom out">-</button>
          </div>
        </div>
        <div class="blotter">
          <div class="bl-h"><h3 class="kick">Live feed</h3><span class="kick" style="color:var(--dim)">Newest first · sample entries until the feeds connect</span></div>
          <div class="bl-s"><table class="tbl"><tbody id="feed"></tbody></table></div>
        </div>
        </div>
        <aside class="cardp" id="cardp" aria-live="polite" aria-label="Selected data point"></aside>
      </div>
    </section>

    <section id="v-tickers" class="view" hidden aria-label="Tickers">
      <div class="tk-list">
        <div class="tk-tools">
          <div class="row" id="tk-filters"></div>
          <input id="tk-q" type="search" placeholder="Filter this list" aria-label="Filter tickers">
        </div>
        <div class="tk-scroll">
          <table>
            <thead><tr><th>Symbol</th><th>Company</th><th class="r">Data points</th><th class="r">Effect</th></tr></thead>
            <tbody id="tk-body"></tbody>
          </table>
        </div>
      </div>
      <article class="tk-detail" id="tk-detail"></article>
    </section>

    <section id="v-desks" class="view" hidden aria-label="Desks">
      <div class="dk-tabs" id="dk-tabs"></div>
      <div class="dk-body" id="dk-body"></div>
    </section>

    <section id="v-sources" class="view" hidden aria-label="Sources"><div class="src-wrap" id="src-wrap"></div></section>
  </main>

  <footer class="status">
    <span>Karasu is a research tool. Nothing here is investment advice.</span>
    <span class="sp" id="st-pos"></span>
    <span id="st-zoom"></span>
    <span><b id="st-clock"></b> UTC</span>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="data.js"></script>
<script>
(function () {
  "use strict";
  var K = window.KARASU, P = K.points, T = K.tickers, D = K.desks;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var fmt = function (n) { return Math.round(n).toLocaleString("en-US"); };
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var byId = {}; P.forEach(function (p) { byId[p.id] = p; });
  var LAY = K.layers, LKEYS = Object.keys(LAY);
  var EFF = { "+": ["Helps", "e-p", "#35E08F"], "-": ["Hurts", "e-m", "#FF7A90"], "~": ["Depends", "e-d", "#E8C77F"], "0": ["Noise", "e-z", "#6F6B80"] };
  var WORDER = { High: 0, Medium: 1, Low: 2, Unknown: 3, Varies: 3 };

  var state = { view: "map", plan: "paid", layers: { energy: true, goods: true, livestock: true, contracts: true }, soon: true, sel: null, cluster: null, ticker: "PLTR", tkFilter: "all", tkQ: "", desk: "energy", srcFilter: "all", t: null };

  var KX = window.KX = { onDraw: [], onFit: [], panel: null, clear: null, layerRows: null, act: null, company: null, companyFacts: null, companyHTML: null, tkRows: null, search: null, sourcesExtra: null, onGeo: null };

  /* ---- indexes */
  var tix = {}; Object.keys(T).forEach(function (s) { tix[s] = []; });
  var back = {};
  P.forEach(function (p) {
    (p.tied || []).forEach(function (t) { (tix[t[0]] = tix[t[0]] || []).push({ p: p, e: t[1], w: t[2] }); });
    (p.corr || []).forEach(function (c) { (back[c[0]] = back[c[0]] || []).push([p.id, c[1]]); });
  });
  Object.keys(tix).forEach(function (s) { tix[s].sort(function (a, b) { return (WORDER[a.p.weight] - WORDER[b.p.weight]) || a.p.name.localeCompare(b.p.name); }); });
  var SYMS = Object.keys(T).sort(function (a, b) { return (tix[b].length - tix[a].length) || (T[b].kpis ? 1 : 0) - (T[a].kpis ? 1 : 0) || a.localeCompare(b); });

  /* ---- small pieces */
  function glyph(layer, hot, s) {
    s = s || 6; var c = LAY[layer][1], a = hot ? 'fill="' + c + '" stroke="none"' : 'fill="none" stroke="' + c + '" stroke-width="1.3" stroke-dasharray="2.2 1.8"';
    var sh = layer === "goods" ? '<rect x="' + (9 - s + 1) + '" y="' + (9 - s + 1) + '" width="' + (2 * s - 2) + '" height="' + (2 * s - 2) + '" rx="1.5" ' + a + "/>"
      : layer === "livestock" ? '<rect x="' + (9 - s + 1.5) + '" y="' + (9 - s + 1.5) + '" width="' + (2 * s - 3) + '" height="' + (2 * s - 3) + '" rx="1" transform="rotate(45 9 9)" ' + a + "/>"
      : '<circle cx="9" cy="9" r="' + (s - .5) + '" ' + a + "/>" + (layer === "contracts" && hot ? '<circle cx="9" cy="9" r="' + (s * .36) + '" fill="#08070B"/>' : "");
    return '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="flex:none">' + sh + "</svg>";
  }
  function wbar(w) { var n = w === "High" ? 3 : w === "Medium" ? 2 : w === "Low" ? 1 : 0; return '<span class="wbar w' + n + '" aria-hidden="true"><i></i><i></i><i></i></span>'; }
  function readBox(label, tone, weight, horizon, text, extra) {
    return '<div class="read" style="--tone:' + (K.tones[tone] || K.tones.flat) + '"><div class="read-top"><span class="tonechip">' + esc(label) + '</span><span class="meta">Weight ' + wbar(weight) + "<b>" + esc(weight) + '</b></span><span class="meta">Horizon <b>' + esc(horizon) + "</b></span></div><p>" + esc(text) + "</p>" + (extra || "") + "</div>";
  }
  function sizeCheck(p) {
    if (!p.usd || !p.co) return null; var t = T[p.co]; if (!t || !t.rev) return null;
    var base = t.base || t.rev, label = t.base ? t.baseLabel : p.co + " revenue (" + t.revLabel + " last quarter)", r = p.usd / base;
    var q = r >= 1 ? "about " + r.toFixed(1) + " quarters of " : "about " + (r >= .1 ? Math.round(r * 100) : (r * 100).toFixed(1)) + "% of one quarter of ";
    return { r: r, text: p.amt + " is " + q + label + "." + (p.shared ? " The award is shared between two companies, so each gets less." : "") };
  }
  function sizeHTML(p) { var s = sizeCheck(p); if (!s) return ""; return '<div class="size"><span class="kick">Size check</span><div class="bar"><i style="width:' + Math.min(100, s.r * 100).toFixed(1) + '%"></i></div><p>' + esc(s.text) + "</p></div>"; }
  function checksHTML(a) { return '<ol class="checks">' + a.map(function (c) { return "<li><span>" + esc(c) + "</span></li>"; }).join("") + "</ol>"; }
  function tieRow(t) { var e = EFF[t[1]]; return '<button type="button" class="tie" data-sym="' + esc(t[0]) + '"><span class="sym">' + esc(t[0]) + '</span><span class="eff ' + e[1] + '">' + e[0] + '</span><span class="why">' + esc(t[2]) + "</span></button>"; }
  function tiesHTML(a) {
    var head = a.slice(0, 6).map(tieRow).join(""), rest = a.slice(6);
    return '<div class="ties">' + head + (rest.length ? "<details><summary>Show " + rest.length + " more tickers</summary>" + rest.map(tieRow).join("") + "</details>" : "") + "</div>";
  }
  function pointRow(id, sub) { var p = byId[id]; if (!p) return ""; return '<button type="button" class="rowbtn" data-point="' + p.id + '">' + glyph(p.layer, p.hot) + "<span><b>" + esc(p.name) + "</b><small>" + esc(sub || (p.hot ? p.detail : "Coverage at launch")) + "</small></span></button>"; }
  function lockHTML() {
    return '<div class="lock"><span class="kick">On the paid plan</span><ul><li>The read: direction, weight and time horizon</li><li>How to check it yourself</li><li>Tied tickers and what it means for each</li><li>Correlated points on the map</li></ul><button type="button" class="btn pink" data-act="plan-paid">See the paid view · [PRICE]/mo</button></div>';
  }
  var paid = function () { return state.plan === "paid"; };

  /* ---- data point card */
  function cardHTML(p) {
    var L = LAY[p.layer], top = '<div class="card-top"><span class="lyrchip" style="--c:' + L[1] + '">' + glyph(p.layer, p.hot) + L[0] + "</span>";
    if (!p.hot) {
      var b = back[p.id] || [];
      return '<div class="card">' + top + '<span class="soonchip">Coverage at launch</span></div><h2>' + esc(p.name) + '</h2><div class="sec"><h3 class="kick">What it will show</h3><p>' + esc(p.note) + '</p></div><div class="sec"><h3 class="kick">Why it is on the map now</h3><p>This marker shows where a feed will land. It carries no data yet, and nothing here is estimated.</p></div>' +
        (b.length ? '<div class="sec"><h3 class="kick">Already linked from</h3>' + b.map(function (c) { return pointRow(c[0], c[1]); }).join("") + "</div>" : "") + "</div>";
    }
    var h = '<div class="card">' + top + '<span class="when">' + esc(p.when) + "</span></div><h2>" + esc(p.name) + '</h2><div class="sec"><h3 class="kick">What we see</h3><p>' + esc(p.what) + '</p><p class="src">' + esc(p.src) + "</p></div>";
    if (!paid()) return h + lockHTML() + "</div>";
    h += '<div class="sec"><h3 class="kick">The read</h3>' + readBox(p.readLabel, p.tone, p.weight, p.horizon, p.read, sizeHTML(p)) + "</div>";
    h += '<div class="sec"><h3 class="kick">How to check it</h3>' + checksHTML(p.checks) + "</div>";
    h += '<div class="sec"><h3 class="kick">Tied to ' + p.tied.length + (p.tied.length === 1 ? " ticker" : " tickers") + "</h3>" + tiesHTML(p.tied) + "</div>";
    if (p.corr && p.corr.length) h += '<div class="sec"><h3 class="kick">Correlated on the map</h3>' + p.corr.map(function (c) { return pointRow(c[0], c[1]); }).join("") + "</div>";

    $("#src-wrap").innerHTML = '<span class="kick">Sources</span><h2 style="margin-top:6px">Every source the terminal can draw on</h2><p class="lede">More information means more feeds. Each row is a public source that can be pinned to a place and tied to a ticker. All but one are free.</p>' +
      kpisHTML([["Sampled in this prototype", String(n.sample), "Real figures, entered by hand for now."], ["Connect next", String(n.next), "The first feeds to go live."], ["On the list", String(n.later), "Each adds a layer or deepens one."], ["Paid", "1", "Real-time exchange prices need a license."]]) +
      '<div class="tk-tools" style="padding:18px 0 10px;border:0"><div class="row">' + [["all", "All " + K.sources.length], ["sample", "Sampled"], ["next", "Next"], ["later", "On the list"]].map(function (f) { return '<button type="button" class="fchip" data-srcf="' + f[0] + '" aria-pressed="' + (state.srcFilter === f[0]) + '">' + f[1] + "</button>"; }).join("") + "</div></div>" +
      '<div class="blk" style="padding:4px 10px"><div class="scroller"><table class="tbl"><thead><tr><th>Source</th><th>Feeds</th><th>What it adds</th><th>Cost</th><th>Refresh</th><th>Status</th></tr></thead><tbody>' + rows.map(function (s) {
        return "<tr><td><b style=\"font-weight:500\">" + esc(s[0]) + '</b></td><td class="sm">' + esc(s[1]) + '</td><td class="sm">' + esc(s[2]) + '</td><td class="mn">' + esc(s[3]) + '</td><td class="mn">' + esc(s[4]) + '</td><td><span class="st ' + s[5] + '">' + STL[s[5]] + "</span></td></tr>";
      }).join("") + "</tbody></table></div></div>" + (KX.sourcesExtra ? KX.sourcesExtra() : "");
  }

  /* ================= SHELL ================= */
  var VIEWS = ["map", "tickers", "desks", "sources"];
  function show(v, push) {
    if (VIEWS.indexOf(v) < 0) v = "map"; state.view = v;
    VIEWS.forEach(function (x) { $("#v-" + x).hidden = x !== v; });
    document.querySelectorAll(".tabs a").forEach(function (a) { if (a.dataset.view === v) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    if (v === "map") { fit(); draw(); } else if (v === "tickers") renderTicker(); else if (v === "desks") renderDesk(); else renderSources();
    if (push && location.hash !== "#" + v) { try { history.replaceState(null, "", "#" + v); } catch (e) { location.hash = v; } }
  }
  function goPoint(id) { var p = byId[id]; if (!p) return; if (!state.layers[p.layer]) { state.layers[p.layer] = true; renderLayers(); } if (!p.hot && !state.soon) { state.soon = true; renderLayers(); } show("map", true); select(p, true); if (window.innerWidth <= 920) $("#mapwrap").scrollIntoView({ block: "start" }); }
  function goTicker(s) { if (!T[s] && !(KX.company && KX.company(s))) return; state.ticker = s; state.tkFilter = "all"; state.tkQ = ""; $("#tk-q").value = ""; show("tickers", true); var r = $('#tk-body tr.on'); if (r && r.scrollIntoView) r.scrollIntoView({ block: "nearest" }); }
  function setPlan(p) { state.plan = p; $("#plan-free").setAttribute("aria-pressed", p === "free"); $("#plan-paid").setAttribute("aria-pressed", p === "paid"); renderCard(); show(state.view); }

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-point],[data-sym],[data-desk],[data-act],[data-layer],[data-preset],[data-tkf],[data-srcf],[data-x]"); if (!el) return;
    var d = el.dataset;
    if (d.x) { if (KX.act) KX.act(d.x, el); }
    else if (d.point) goPoint(d.point);
    else if (d.sym) goTicker(d.sym);
    else if (d.desk) { state.desk = d.desk; show("desks", true); }
    else if (d.layer) { state.layers[d.layer] = !state.layers[d.layer]; renderLayers(); draw(); }
    else if (d.preset !== undefined) { var b = K.presets[+d.preset][1]; go(b ? boundsT(b) : home(), 850); }
    else if (d.tkf) { state.tkFilter = d.tkf; renderTkList(); }
    else if (d.srcf) { state.srcFilter = d.srcf; renderSources(); }
    else if (d.act === "plan-paid") setPlan("paid");
    else if (d.act === "plan-free") setPlan("free");
    else if (d.act === "soon") { state.soon = !state.soon; renderLayers(); draw(); }
    else if (d.act === "zin") svg.transition().duration(reduce ? 0 : 220).call(zoom.scaleBy, 1.7);
    else if (d.act === "zout") svg.transition().duration(reduce ? 0 : 220).call(zoom.scaleBy, 1 / 1.7);
    else if (d.act === "sources") show("sources", true);
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target.matches && e.target.matches("tr[data-sym],tr[data-point]")) e.target.click(); });
  $("#tk-q").addEventListener("input", function () { state.tkQ = this.value; renderTkList(); });

  /* search */
  var qi = $("#q"), qr = $("#qres"), qhits = [];
  function runSearch() {
    var q = qi.value.trim().toLowerCase(); if (!q) { qr.hidden = true; return; }
    qhits = [];
    SYMS.forEach(function (s) { if (s.toLowerCase().indexOf(q) === 0 || T[s].n.toLowerCase().indexOf(q) >= 0) qhits.push(["Ticker", s + " · " + T[s].n, "sym", s]); });
    P.forEach(function (p) { if (p.name.toLowerCase().indexOf(q) >= 0) qhits.push([p.hot ? "Point" : "Launch", p.name, "point", p.id]); });
    Object.keys(D).forEach(function (k) { if (D[k].title.toLowerCase().indexOf(q) === 0) qhits.push(["Desk", D[k].title, "desk", k]); });
    if (KX.search) KX.search(q, qhits);
    qhits = qhits.slice(0, 9);
    qr.innerHTML = qhits.length ? qhits.map(function (h, i) { return '<button type="button" class="' + (i ? "" : "on") + '" data-' + h[2] + '="' + esc(h[3]) + '"><span class="k">' + h[0] + "</span><span>" + esc(h[1]) + "</span></button>"; }).join("") : '<div class="none">Nothing matches. Try a ticker like HII or a place like Suez.</div>';
    qr.hidden = false;
  }
  qi.addEventListener("input", runSearch); qi.addEventListener("focus", runSearch);
  qi.addEventListener("keydown", function (e) { if (e.key === "Enter" && qhits.length) { var b = $("button", qr); if (b) b.click(); qi.value = ""; qr.hidden = true; qi.blur(); } else if (e.key === "Escape") { qr.hidden = true; qi.blur(); } });
  qr.addEventListener("click", function () { qi.value = ""; qr.hidden = true; });
  document.addEventListener("click", function (e) { if (!e.target.closest(".search")) qr.hidden = true; });

  window.addEventListener("hashchange", function () { var v = location.hash.slice(1); if (v !== state.view) show(v); });
  var rz; window.addEventListener("resize", function () { clearTimeout(rz); rz = setTimeout(function () { if (state.view === "map") { fit(); draw(); } }, 120); });
  function tick() { var d = new Date(); $("#st-clock").textContent = d.toISOString().slice(11, 19); }
  tick(); setInterval(tick, 1000);

  /* boot */
  renderPulse(); renderLayers(); renderFeed(); renderPresets(); renderLegend(); buildStatic();
  state.sel = byId.hormuz; renderCard();
  show(location.hash.slice(1) || "map");
  function get(u) { return fetch(u).then(function (r) { if (!r.ok) throw new Error(u); return r.json(); }); }
  get("world110.json").then(function (w) { setWorld(w, false); mapReady = true; draw(); return get("states.json"); })
    .then(function (s) { setStates(s); draw(); return get("world50.json"); })
    .then(function (w) { setWorld(w, true); draw(); })
    .catch(function () { if (!mapReady) { var d = document.createElement("div"); d.className = "maperr"; d.textContent = "The map outline did not load. Reload the page to try again. Data points still work."; $("#mapwrap").appendChild(d); } });
  var core = { K: K, P: P, T: T, D: D, tix: tix, byId: byId, LAY: LAY, POSTAL: POSTAL, state: state, proj: proj, path: path, svg: svg, zoom: zoom, esc: esc, fmt: fmt, glyph: glyph, wbar: wbar, readBox: readBox, checksHTML: checksHTML, tiesHTML: tiesHTML, pointRow: pointRow, lockHTML: lockHTML, paid: paid, kpisHTML: kpisHTML, renderCard: renderCard, renderLayers: renderLayers, renderTicker: renderTicker, renderSources: renderSources, draw: draw, go: go, flyTo: flyTo, boundsT: boundsT, goPoint: goPoint, goTicker: goTicker, show: show, home: home, reduce: reduce, dims: function () { return { W: W, H: H, k0: k0, kmax: KMAX }; } };
  Object.keys(core).forEach(function (k) { KX[k] = core[k]; });
  window.__karasu = KX;
})();
</script>
